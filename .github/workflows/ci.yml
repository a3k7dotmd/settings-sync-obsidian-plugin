name: Continuous Integration

on: 
  pull_request:
    branches:
      - master
    paths: 
      - 'src/**'
      - 'test/**'
  push: 
    branches:
      - master
    paths: 
      - 'src/**'
      - 'test/**'
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    name: Run unit tests
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository 
        uses: actions/checkout@v4

      - name: Use Node.js "18.x"
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
      
      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm run test

  lint:
    name: Run linter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository 
        uses: actions/checkout@v4

      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
      
      - name: Install Dependencies
        run: npm install
      
      - name: Run linter
        run: npm run lint

  build: 
    name: Build Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository 
        uses: actions/checkout@v4

      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
      
      - name: Install Dependencies
        run: npm install

      - name: Run Build
        run: npm run build
  
  audit: 
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository 
        uses: actions/checkout@v4

      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
      
      - name: Install Dependencies
        run: npm install

      - name: Audit for vulnerabilities
        # Only the packages that ship inside main.js. Findings in development tools (jest, eslint,
        # esbuild) do not reach users and made this job fail on every push.
        run: npm audit --omit=dev --audit-level=moderate
